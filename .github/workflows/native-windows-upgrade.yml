name: Stock Windows existing-project core upgrade 0.9.5 to 0.9.6
on:
  push:
    branches: [work/native-install-upgrade-0.9.6]
    paths:
      - '.github/workflows/native-windows-upgrade.yml'
      - 'scripts/native-windows-upgrade/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select fresh private hosted output root
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / ('fbones-windows-upgrade-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUN_ROOT=' + str(root) + '\n')
      - name: Verify stock payloads and statically stream target native member
        shell: bash
        env:
          FBONES_METADATA_TOKEN: ${{ github.token }}
        run: |
          python scripts/native-windows-upgrade/assets.py windows-nsis --root "$RUN_ROOT"
          python scripts/native-windows-upgrade/prepare-target.py "$RUN_ROOT"
      - name: One actual stock core upgrade and separately labeled native Open
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\native-windows-upgrade\windows.ps1 -Root "%RUN_ROOT%"
      - name: Preserve bounded evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-upgrade
          path: ${{ env.RUN_ROOT }}/reports/
          retention-days: 7
          if-no-files-found: warn
