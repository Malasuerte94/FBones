name: Own stock macOS New and native Save
run-name: Own macOS native Save at ${{ github.sha }}
on:
  push:
    branches: [work/native-install-upgrade-0.9.6]
    paths: ['.github/workflows/native-macos-picker.yml', 'scripts/native-mac-picker/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-picker:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select own fresh root
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / ('fbones-mac-picker-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          assert not root.exists()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUN_ROOT=' + str(root) + '\n')
      - name: Verify and fetch exact published stock0.9.5
        shell: bash
        env:
          FBONES_METADATA_TOKEN: ${{ github.token }}
        run: python scripts/native-mac-picker/assets.py mac-dmg --root "$RUN_ROOT"
      - name: Own ordinary New and native Save capability
        shell: bash
        run: bash scripts/native-mac-picker/mac.sh "$RUN_ROOT"
      - name: Preserve native receipts and useful negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-picker
          path: ${{ env.RUN_ROOT }}/reports/
          retention-days: 7
          if-no-files-found: warn
