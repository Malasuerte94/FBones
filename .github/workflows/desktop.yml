name: Desktop checks and builds
on:
  push:
    branches: [main]
    tags: ['v*.*.*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build ${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      FBONES_SIGNED_UPDATES: ${{ github.ref_type == 'tag' && '1' || '0' }}
      # Explicit ad-hoc signing; this is not Developer ID signing or notarization.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf file wget curl
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Remap private build paths
        run: python scripts/ci-build.py configure
      - run: pnpm install --frozen-lockfile
      - run: python scripts/test-public-release.py
      - run: node scripts/test-updater-signature.mjs
      - run: python scripts/test-signed-release.py
      - run: python scripts/test-update-version.py
      - run: pnpm build:runtime
      - name: Verify independent runtime package
        run: node packages/runtime/tests/runtime.test.mjs
      - run: pnpm test
      - run: pnpm typecheck:ui
      - run: cargo test --workspace --locked
      - run: cargo test -p fbones-desktop --no-default-features --locked
      - name: Build platform installers
        if: github.ref_type != 'tag'
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build signed platform installers and updater packages
        if: github.ref_type == 'tag'
        env:
          FBONES_RELEASE_UPDATER: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --ci --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify executable and package structures
        run: python scripts/ci-build.py verify --target ${{ matrix.target }}
      # Stage only report-listed packages; never upload the native build tree.
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: installers-${{ matrix.target }}
          path: ci-installers/${{ matrix.target }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  linux-ui:
    name: Ubuntu UI and README
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential libssl-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select installed Playwright Chromium
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROME_BINARY=" + chromium.executablePath() + "\n")'
      # The UI runner deliberately builds its Rust host offline.
      - run: cargo fetch --locked
      - run: pnpm test:ui
      - name: Verify native exports in the independent runtime
        run: pnpm test:runtime
      - name: Package independent runtime archive
        run: |
          mkdir -p .local/ci-runtime-release
          npm pack ./packages/runtime --pack-destination .local/ci-runtime-release
          python scripts/prepare-runtime-release.py .local/ci-runtime-release
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-package
          path: .local/ci-runtime-release/
          include-hidden-files: true
          if-no-files-found: error
      - name: Validate README links and screenshot integrity
        run: python scripts/check-public-readme.py
      - name: Retain UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ui-failures
          path: |
            .local/playwright/results.json
            .local/playwright/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  release:
    name: Publish app installers and runtime beta after all checks
    needs: [desktop, linux-ui]
    if: github.repository == 'Malasuerte94/FBones' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify source release
        run: python scripts/prepare-public-release.py --tag "$RELEASE_TAG" --output .local/ci-source-release
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: .local/platform-installers
      - uses: actions/download-artifact@v4
        with:
          name: runtime-package
          path: .local/runtime-release
      - name: Verify and collect installers, runtime, source, and build reports
        run: |
          python scripts/prepare-runtime-release.py .local/runtime-release
          python scripts/prepare-installer-release.py assemble --installers .local/platform-installers --source .local/ci-source-release --runtime .local/runtime-release --output .local/verified-release --tag "$RELEASE_TAG"
      - name: Require a newer installed application version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-update-version.py
      - name: Publish Latest beta app, runtime, checksums, and build reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" .local/verified-release/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease=false --latest --title "FBones $RELEASE_TAG — app installers and runtime preview" --notes-file "docs/releases/$RELEASE_TAG.md"
