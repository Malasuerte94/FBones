[package]
name = "fbones-desktop"
default-run = "fbones"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "fbones_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fbones"
path = "src/main.rs"

[[bin]]
name = "fbones-e2e-host"
path = "src/e2e_host_main.rs"
required-features = ["e2e-host"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
fbones-format = { path = "../crates/fbones-format" }
png = "=0.18.1"
base64 = "=0.22.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[features]
default = ["scene-editing"]
custom-protocol = ["tauri/custom-protocol"]
scene-editing = ["fbones-format/scene-codec"]
e2e-host = ["scene-editing"]
